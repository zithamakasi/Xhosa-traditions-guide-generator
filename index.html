<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <link rel="stylesheet" href="src/style.css">
    <title>AI Xhosa traditions guide generator</title>
</head>

<body>

    <div class="container">

        <header>
            <h1 class="heading">AI Xhosa Traditions Guide Generator </h1>
        </header>

        <main>
            <form id="generator">
                <input type="text" placeholder="Enter topic for a xhosa tradition" autofocus required autocomplete="off"
                    class="input" />
                <input type="submit" placeholder="Submit" class="search" />

            </form>
            <div class="para" id="paragraph"></div>
        </main>
        <footer class="foot">This AI project was coded by <a href="https://github.com/zithamakasi" target="_blank"
                class="link">Zitha Makasi</a>
            and is open-soured on <a href="https://github.com/zithamakasi/Xhosa-traditions-guide-generator"
                target="_blank" class="link">Github</a> and
            hosted on <a href="https://ai-xhosa-traditions-guide-generator.netlify.app/" target="_blank"
                class="link">Netlify</a>
        </footer>
    </div>
    <script src="src/index.js"></script>

</body>

</html>
